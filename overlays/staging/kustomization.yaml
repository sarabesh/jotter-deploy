# STAGING: deployed automatically by Argo CD when this file changes on main.
# newTag is set by jotter's release workflow (kustomize edit set image) after each release.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jotter-staging
resources:
- ../../base
images:
- name: ghcr.io/sarabesh/jotter
  newTag: 0.4.1
patches:
- patch: |-
    - op: add
      path: /spec/ports/0/nodePort
      value: 30081 # http://localhost:8081
  target:
    kind: Service
    name: jotter
