# Tells Argo CD: keep overlays/prod (main branch) running in namespace jotter-prod.
# Auto-sync: the human gate is merging the "deploy(prod): …" PR — once it's on main, it deploys.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jotter-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default
  source:
    repoURL: https://github.com/sarabesh/jotter-deploy.git
    targetRevision: main
    path: overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: jotter-prod
  syncPolicy:
    automated:
      prune: true # removed from git -> removed from the cluster
      selfHeal: true # changed by hand in the cluster -> put back to what git says
    syncOptions:
      - CreateNamespace=true
